services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 recipe_manager.wsgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - ./data:/app/data  # <--- СОХРАНЯЕМ ЗАГРУЖЕННЫЕ ФАЙЛЫ НА КОМПЬЮТЕРЕ
    ports:
      - "8000:8000"
    env_file:
      - .env              # <--- ПЕРЕДАЕМ СЕКРЕТЫ ИЗ .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume: