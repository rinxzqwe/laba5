{% extends 'recipes/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2>{% if is_edit %}Редактировать{% else %}Добавить рецепт{% endif %}</h2>
        <form method="post" class="card p-4 shadow-sm mt-3">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-bold">{{ field.label }}</label>{{ field }}
                    {% if field.errors %}<div class="text-danger">{{ field.errors|striptags }}</div>{% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Сохранить</button>
        </form>
    </div>
</div>
{% endblock %}
