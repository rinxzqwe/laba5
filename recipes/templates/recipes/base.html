<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Recipe Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">Recipe Manager</a>
    <div class="navbar-nav">
      <a class="nav-link" href="{% url 'recipe_create' %}">Добавить</a>
      <a class="nav-link" href="{% url 'upload_file' %}">Загрузить файл</a>
      <a class="nav-link" href="{% url 'file_list' %}">Просмотр данных</a>
    </div>
  </div>
</nav>
<div class="container">
    {% if messages %}{% for m in messages %}<div class="alert alert-{{ m.tags }}">{{ m }}</div>{% endfor %}{% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
